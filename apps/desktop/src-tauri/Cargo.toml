[package]
name = "trading-app-desktop"
version = "0.0.0"
description = "Trading App Desktop Shell"
authors = ["Primo Games"]
edition = "2021"

[lib]
name = "trading_app_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "trading-app-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["keychain"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
