      # Its siblings above are dashboard-owned (`sync: false` = "a blueprint
      # apply must not touch this"). If WATCHDOG_RSS_MAX_MB were declared the
      # same way — or, as it was until now, NOT DECLARED AT ALL — then a
      # blueprint apply would leave it unset, the code default of 1900 MB would
      # take over, and the exact defect this issue fixed would silently return
      # on a 4 GB box: the guard killing a healthy engine every ~7 minutes.
      # An UNDECLARED env var is not a neutral omission; it is a vote for the
      # code default, and here the code default is the bug.
      #
      # 3400 MB is bracketed: ABOVE the 2.0-2.2 GB RTH working set (so it does
      # not fire on healthy load) and BELOW the 4096 MB `pro` cgroup with ~700 MB
