      - key: CRYPTO_TICK_MAX_CONCURRENT
        value: "4"
      # TRA-1080 — event-loop/heap starvation watchdog. The watchdog itself is
      # ON by default in code (no env needed); these knobs are declared
      # `sync: false` so an operator can DISABLE or RETUNE it from the dashboard
      # during an incident without a redeploy. Leave unset for the safe defaults:
      #   WATCHDOG_ENABLED=true, WATCHDOG_RESTART_ENABLED=true,
      #   WATCHDOG_HEAP_PCT=0.92, WATCHDOG_LAG_MS=2000, WATCHDOG_BREACH_SAMPLES=10
      #   (10 consecutive 1s samples ⇒ a trip needs ~10s of SUSTAINED >2s lag or
      #   >92% heap, so a single GC pause / slow tick never restarts a healthy
      #   box). TRA-1082 — WATCHDOG_BLOCK_MS=4000 adds an ACUTE single-block trip:
      #   one 1s window whose MAX lag ≥4s self-restarts immediately (a stall that
      #   long has already blown Render's 5s health-check budget, so a clean exit
