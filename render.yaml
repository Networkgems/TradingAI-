      # are `no_trade` (live stand-down) and `crypto_core` (DCA-only forward leg).
      - key: LIVE_STRATEGY_PRESET
        value: ""
      # TRA-456 — DEMO engine strategy preset. The `LIVE_STRATEGY_PRESET`
