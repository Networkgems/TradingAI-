# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint
#
# TRA-547 UPDATE (2026-06-03): a Render service IS now live and is the backend
# for the public GitHub Pages site — `https://tradingai-bqb1.onrender.com`
# (health verified `GET /api/health → {ok:true}`). The canonical public backend
# URL is recorded in `apps/desktop/src/server-url.ts` (`PROD_BACKEND_URL`) and
# the CI `VITE_SERVER_URL` secret. The `name:` below is now `tradingai-bqb1`
# to MATCH the live service (Render derives the hostname from the service
# name). The earlier name (`tradingai-server.onrender.com`) is dead (404); do
# not revert `name:` to it or a re-applied blueprint will provision a SECOND,
# empty service instead of updating the live one.
#
# ⚠️ Not multi-instance safe: never run two live instances against the same
# broker (Tradier) credentials.
#
# TRA-549 OWNERSHIP DECISION (CTO, 2026-06-03): THIS Render service
# (`tradingai-bqb1`) is the SINGLE owner of live (production) Tradier
# credentials — it is the only publicly-reachable backend (it serves the GitHub
# Pages site), whereas the self-hosted PM2 process on `PG-DEVOPS14`
# (`docs/runbook.md` §1) binds host-local with no reverse proxy and cannot be
# the public live-trading instance. The PM2 self-host is stood down to
# sandbox-only (`TRADIER_ENV=sandbox`, hard-pinned in `ecosystem.config.cjs`),
# so set `TRADIER_ENV=production` and the production `TRADIER_*` pair HERE (in
# the Render dashboard) — and NOWHERE else. Gate: this ownership must hold (or
# be explicitly re-decided, de-credentialing the loser first) before any change
# flips `LIVE_STRATEGY_PRESET` off `no_trade`. (TRA-609: that flip has now
# happened per board override — Render is the sole production live instance and
# the PM2 self-host is sandbox-only, so this ownership condition holds.)
#
# Historical (TRA-444, 2026-05-17): at that time no Render service was
# provisioned and production ran self-hosted under PM2. Superseded by the
# TRA-547 update above for the public-backend question.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: tradingai-bqb1
    runtime: node
    # TRA-1038 — MUST be `standard` (2 GB), NOT `starter` (512 MB). The live
    # service `srv-d7mb7rr7uimc73ev0chg` runs `standard` and its 24 h memory
    # peak is ~1.53 GB (avg ~0.7 GB) — well above starter's 512 MB ceiling, so a
    # blueprint re-apply at `starter` would OOM the public demo on boot. This
    # line previously read `starter` and was a latent footgun; do not revert it
    # without first trimming steady-state memory below 512 MB (tracked as a
    # cost-optimization follow-up). CPU avg ~0.28 / peak ~0.96 of 1 vCPU is fine
    # on standard.
    plan: standard
    buildCommand: pnpm install --frozen-lockfile && pnpm run web:build
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /api/health
    disk:
      name: tradingai-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      # TRA-404 — session-token max lifetime in hours. Leave unset for the
      # 24h default; `verifyToken` rejects any token older than this.
      - key: AUTH_TOKEN_TTL_HOURS
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      # TRA-1080 — pin the V8 old-space ceiling. The service runs `standard`
      # (2 GB RAM); without this, V8 auto-sizes the old-space heap and on a 2 GB
      # box GC only gets aggressive very late, so the per-tick growth during RTH
      # drives back-to-back full GCs near the ceiling (the "GC thrash" that
      # starves the event loop and kills the HTTP listener). Pinning to 1536 MB
      # leaves ~512 MB headroom for RSS/native/buffers (24h peak ~1.53 GB total
      # per the `plan: standard` note above) and makes the heap watchdog's
      # `heap_size_limit` deterministic. Lower this if the box is ever moved to a
      # smaller plan. `--max-semi-space-size=64` enlarges the young generation so
      # short-lived per-tick allocations are collected by cheap scavenges instead
      # of being promoted into old space and amplifying the thrash.
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536 --max-semi-space-size=64
      - key: DATA_DIR
        value: /data
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@tradingai.app
      # Crypto quote fallback — when set, CoinMarketCap serves quotes whenever the
      # Yahoo Finance crypto path is rate-limited or returns no data.
      - key: CMC_API_KEY
        sync: false
      # Crypto quote fallback (TRA-833) — CoinGecko `/coins/markets`. Resolves from
      # the Render datacenter egress IP (both Coinbase hosts time out there), prices
      # the whole universe in one batched call, and keeps Current / P&L flowing for
      # open positions. Works keyless at the public rate tier; set a free Demo key
      # here to raise the per-minute limit. Optional.
      - key: COINGECKO_API_KEY
        sync: false
      # Stocks minute-bar fallback (TRA-154) — when set, Twelve Data serves
      # consolidated 1-minute candles whenever Tradier (primary) and Yahoo
      # both miss for an "active interest" symbol (open position or recent
      # signal). Free tier is 800 req/day, 8 req/min — gating + per-minute
      # caching keep us inside. Also used by `backtest-equity` for historical
      # data pulls.
      - key: TWELVE_DATA_API_KEY
        sync: false
      # AI Options Ideas — Anthropic (Claude) API key for the live
      # `GET /api/options/ideas` feed (TRA-604 wiring, TRA-600 C5 UI). When
      # UNSET (current state) the endpoint correctly degrades: HTTP 200 with
      # `source:"non_live"`, empty `ideas`, and a note instructing to set
      # ANTHROPIC_API_KEY — the panel falls back to a labelled preview and
      # disables paper entry. This is the documented expected-non-bug
      # degradation that passed QA in TRA-685; declaring the key here (dashboard
      # `sync:false`) makes the blueprint launch-ready without committing the
      # secret. Spend is pre-authorized at the $50/mo cap with the auto-degrade
      # tripwire enforced in code per TRA-658 / TRA-604 (CFO guardrail). Set the
      # value in the Render dashboard at the C6 live-launch (TRA-686) to flip the
      # feed to `source:"live"`; leaving it unset keeps the feature in safe
      # preview mode.
      - key: ANTHROPIC_API_KEY
        sync: false
      # ───────────────────────────────────────────────────────────────────────
      # TRA-1202 — Anthropic bill cap to the owner's ~$5/week budget.
      #
      # Live readout showed the spend is the TRADING-AGENTS ADVISORY layer (the
      # "Proposals" path: per-30s-tick analyst/trader/risk LLM calls when the
      # per-user Trading-Agents banner is ON), NOT the AI Options Ideas tab
      # (`/api/health/options-spend` = $0/mo). On 2026-06-30 user `admin` had
      # already hit the OLD $10/user/day advisory cap by mid-session — i.e. up to
      # ~$70/week — which matches the ~$20/week invoices. Neither tab places
      # orders; this is generation cost, not execution.
      #
      # Three levers, all enforced in code (agent-spend-store / options-spend-store /
      # anthropic-llm-client) and overridable here without a code change:
      #   1) Advisory per-user/day cap $10 → $0.50  (~$3.50/wk worst case).
      #   2) Advisory company/day ceiling $100 → $0.50 (single-user demo; matches #1).
      #   3) AI Options Ideas monthly cap $50 → $5   (~$1.15/wk; currently $0 spend).
      #   Worst-case sum ≈ $4.65/wk < the $5/wk target. When a cap is reached the
      #   feature degrades to the deterministic ZERO-cost path (advisory) or a
      #   labelled non-live feed (ideas) — no user-facing break, no capital impact.
      #
      # 4) Strong tier Sonnet-4.6 → Haiku-4.5 for the trader/risk synthesis steps:
      #   ~3x cheaper input AND output, so the SAME $0.50/day buys ~3x more
      #   LLM-authored proposals before the cap trips. Haiku 4.5 keeps structured
      #   outputs (JSON schema) and temperature; it has no adaptive thinking, which
      #   is OFF by default here anyway. Analysts already run on Haiku (`fast`).
      #   Revert any line below to restore the prior cost/quality point.
      - key: TRADING_AGENTS_DAILY_USER_USD_CAP
        value: "0.50"
      - key: TRADING_AGENTS_COMPANY_DAILY_USD_CAP
        value: "0.50"
      - key: OPTIONS_IDEAS_MONTHLY_USD_CAP
        value: "5"
      - key: LLM_MODEL_STRONG
        value: claude-haiku-4-5
      # ───────────────────────────────────────────────────────────────────────
      # Tradier API credentials (TRA-191) — required for the options-chain
      # relative-value scanner to fetch live chains. With these unset the
      # scanner reports `no_credentials` and the engine simply skips options
      # scanning (equity / share trading is unaffected). All values are set
      # in the Render dashboard; we never commit them to source.
      #
      # Production credentials. Used when TRADIER_ENV=production.
      - key: TRADIER_API_TOKEN
        sync: false
      - key: TRADIER_ACCOUNT_ID
        sync: false
      # Sandbox / paper-trading credentials. Used when TRADIER_ENV=sandbox
      # (the default). Falls back to the unprefixed pair above when these
      # are unset so legacy single-pair setups still work.
      - key: TRADIER_SANDBOX_API_TOKEN
        sync: false
      - key: TRADIER_SANDBOX_ACCOUNT_ID
        sync: false
      # `sandbox` (default) or `production`. Use `sandbox` for paper testing
      # and `production` only when the trading account is confirmed and you
      # actually want to route real orders.
      - key: TRADIER_ENV
        sync: false
      # TRA-928 / TRA-911 (TRA-908 Phase A) — turn the OPTIONS shadow selector ON.
      # Until this is set, `isOptionShadowEnabled()` is false, the per-tick option-
      # structure pass in `signal-engine.ts` (gated at L1780) never runs, and
      # `GET /api/health/option-shadow-signals` reports `flagEnabled:false, count:0`
      # — i.e. the agents that pick call/put spreads emit NOTHING and the
      # live-capital gate accrues zero evidence (sample_size:0). This is the lever
      # the board's "nothing firing on options" report traces to.
      #
      # SAFETY — Phase A is observe-only: the pass APPENDS well-formed shadow
      # signals to an append-only JSONL ledger and NEVER routes an order or commits
      # capital (`option-shadow-ledger.ts` L19-22). It is gated to market hours and
      # rides the RV scanner's warm chain cache (no extra Tradier budget). Turning
      # it off again is just clearing this value.
      #
      # NOTE — necessary but not alone sufficient for visible call/put ideas:
      #   • the RV scanner must exist (needs the TRADIER_* prod creds above), else
      #     the shadow pass early-returns (`signal-engine.ts` L2968);
      #   • the AI options-ideas feed stays in non-live preview until
      #     ANTHROPIC_API_KEY (above) is set in the dashboard.
      - key: ENABLE_OPTION_SHADOW_SELECTOR
        value: "true"
      # TRA-967 / TRA-953 (TRA-908 Phase B) — turn OPTIONS PHASE-B PAPER
      # EXECUTION ON. Board-approved (approval c10b717e-294f-4718-8a7c-11a2cd18875f,
      # parallel to the shadow-flag approval 8fb26954 in TRA-942). Until this is
      # set, `isOptionPhaseBEnabled()` is false and the shadow selector's
      # per-tick `decision:'signal'` structures are observed-only (appended to the
      # JSONL ledger) and never routed into the paper options book —
      # `GET /api/health/options-pipeline` reports `phaseBPaperExecutionEnabled:false`.
      #
      # SAFETY — PAPER-ONLY. This is strictly subordinate to
      # ENABLE_OPTION_SHADOW_SELECTOR (above): with the shadow flag off this does
      # nothing. When on, each selected defined-risk structure routes into
      # `PaperOptionsAccount.openDefinedRiskSpread` with mode:'demo' — NO Tradier
      # mirror, NO live capital. It is gated to market hours and rides the RV
      # scanner's warm chain cache (no extra Tradier budget). Revert = clear this
      # value (flip the flag off). Closing TRA-967 unblocks TRA-953, which then
      # accrues demo option fills during the next RTH.
      - key: ENABLE_OPTION_PHASE_B_PAPER
        value: "true"
      # TRA-991 / TRA-990 — turn ON the OPTION-TRADE JOURNAL (observe-only). The
      # journal (`option-trade-journal.ts`) is a durable, append-only setup→outcome
      # ledger: when a Phase-B demo structure opens/closes it records the setup
      # (IV-rank, trend, sentiment, entry delta/DTE, capital-at-risk) paired with
      # the realized P&L / R-multiple, and `learned-option-weights.ts` folds that
      # into bounded scoring weights. Until this is set, `recordOptionTradeOpen/
      # Close` no-op and `/api/health/option-journal` reports `enabled:false`.
      #
      # SAFETY — DEMO-ONLY, OBSERVE-ONLY, NO CAPITAL PATH. It only RECORDS what the
      # paper book already did; nothing here routes an order, and feeding the
      # learned weights back into decisions is explicitly OUT OF SCOPE (Child B,
      # TRA-991). Subordinate to the Phase-B paper flag above (no demo option
      # opens → nothing to journal). Revert = clear this value.
      - key: ENABLE_OPTION_TRADE_JOURNAL
        value: "true"
      # TRA-1114 / TRA-1113 (board escalation, 3rd time) — turn ON the DEMO-ONLY
      # DETERMINISTIC DIRECTIONAL call/put entry so the board can SEE calls AND
      # puts executing in the demo paper book. Root cause of the prior "config is
      # live but nothing fires" closes: the only enabled idea source on the
      # executing single-leg path is the legacy RV ANOMALY scanner, which surfaces
      # nothing on calm days (TRA-592), and the Phase-A/B spread selector stands
      # DOWN whenever the trailing-year IV-rank store is thin (`ivRank === null`),
      # which it is on this demo — so Phase-B paper execution is on but has nothing
      # to execute. When this is set, each tick reads the SAME TRA-734 confluence
      # trend the rest of the option stack uses and opens ONE near-ATM single-leg
      # long — a call on uptrend symbols, a put on downtrend ones — directly off
      # the live selector chain via `openOptionFromRvCandidate`. Across the equity
      # watchlist both calls and puts fill. `/api/health/options-pipeline` reports
      # `optionDemoDirectionalEnabled:true` and `openOptionsCount > 0` during RTH.
      #
      # SAFETY — DEMO/PAPER ONLY. The engine hard-gates this on `mode === 'demo'`;
      # the open is `mode:'demo'` with no equity override → NO Tradier mirror, NO
      # live capital. OFF by default (prod/live byte-for-byte unchanged when unset).
      # Live-capital promotion stays independently gated on TRA-382. Revert = clear
      # this value. Accepts the usual truthy spellings (1/true/yes/on).
      - key: ENABLE_OPTION_DEMO_DIRECTIONAL
        value: "true"
      # TRA-1292 — arm the OBSERVE-ONLY defined-risk SHORT-PREMIUM scanner (credit
      # spreads / iron condors) on the demo book. Each demo tick (market hours)
      # rides the SAME warm RV selector chain, computes realised vol from the
      # underlying's daily closes (the VRP baseline), stamps the trailing-year
      # IV-rank (TRA-1153), and assembles put/call credit spreads + iron condors
      # gated on ivRank>=50 + VRP-positive (IV/RV>=1) + short-strike delta
      # ~0.15-0.30 (~60-70% PoP). Surfaced read-only at
      # `/api/health/short-premium` (`enabled:true`).
      #
      # SAFETY — DEMO/PAPER, OBSERVE-ONLY. The pass hard-gates on `mode==='demo'`
      # and NEVER routes into the paper book (no order is ever placed off these
      # structures); it only records candidates for the board to watch. OFF by
      # default (prod/live byte-for-byte unchanged when unset). Demo routing /
      # graduation + live promotion (TRA-382) are separate decisions. NOTE:
      # blueprint sync ≠ autoDeploy on bqb1 (TRA-1289) — a redeploy is needed for
      # this var to take effect on the running service. Accepts 1/true/yes/on.
      - key: ENABLE_OPTION_SHORT_PREMIUM_SCANNER
        value: "true"
      # TRA-1064 / TRA-921 (TRA-920 desk reversal) — turn ON the REVERSAL-SHADOW
      # signal ledger (observe-only). The capture (`reversal-shadow-ledger.ts`) is
      # a durable, append-only JSONL: when the desk S/R-reversal checklist prints a
      # setup it records the four scored legs + bracket, then resolves TP/SL over a
      # forward horizon (shared VERBATIM with the Supertrend ledger). Those resolved
      # rows feed `learned-weights` byScore/byPattern/bySymbol AND give the cold-
      # start shrinkage estimator (TRA-1056) its non-null global `priorRate`. Until
      # this is set, `isReversalShadowEnabled()` is false, the pipeline appends
      # nothing, and `/api/health/reversal-shadow-signals` reports
      # `flagEnabled:false, count:0` → `learned-weights.priorRate:null` → the
      # ENABLE_LEARNED_WEIGHT_SHRINKAGE estimate is a literal no-op (shrunk falls
      # back to neutral 1.0). Populating this is the gating dependency for the
      # TRA-1062 shrinkage A/B sign-off.
      #
      # SAFETY — SCORING-only research accrual, NO CAPITAL PATH. It only RECORDS the
      # checklist setups the desk reversal agent already evaluates; nothing here
      # routes an order. Live-capital promotion stays independently gated on
      # TRA-382. Revert = clear this value (flip the flag off). Accepts the usual
      # truthy spellings (1/true/yes/on).
      - key: ENABLE_REVERSAL_SHADOW
        value: "true"
      # TRA-1060 / TRA-1058 (TRA-1051 F2) — turn ON the COLD-START DAILY-CANDLE
      # PREFETCH warmer on this demo book for the QuantTrader soak. The warmer
      # (`crypto-engine.ts warmDailyCandlesOnBoot`) is an async one-shot at boot
      # that front-loads the daily-candle cache through the SAME paced fetch path
      # the steady-state tick loop uses (shared Coinbase/Tradier pacer + breaker +
      # the 1h fetch-gate in `refreshDailyCandles`), self-throttled to
      # COLD_START_DAILY_PREFETCH_PER_MIN (default 48/min, hard-clamped to 120/min).
      # Until this is set, `isColdStartDailyPrefetchEnabled()` is false, the warmer
      # never runs, and `/api/health/cold-start-prefetch` reports `enabled:false,
      # lastRun:null` — prod behaviour byte-for-byte unchanged.
      #
      # SAFETY — NO CAPITAL PATH, NO NEW PROVIDER LOAD CEILING. It only re-uses the
      # existing paced candle fetchers to warm the cache earlier; it shares the same
      # rolling req/min meter (`coinbaseBarPullRate` / `tradierBarPullRate` on
      # `/api/health/quotes`) the soak watches against the ~200/min per-IP ceiling,
      # and cannot double-fetch a symbol the tick already warmed. Revert = clear this
      # value (flip the flag off). Accepts the usual truthy spellings (1/true/yes/on).
      - key: ENABLE_COLD_START_DAILY_PREFETCH
        value: "true"
      # TRA-1391 — how long (ms) after an engine begins ticking the cold-start
      # warmer above waits before its FIRST fetch. Leave unset for the safe
      # default (150000 = 2.5 min, just past the 120s watchdog bootGrace). The
      # warmer used to fire the instant ticking began, so on a cold cache its
      # paced fan-out ran concurrently with the first (heaviest) ticks — a doubled
      # paced storm through the one Coinbase pacer during exactly the window where
      # the event-loop watchdog is muzzled (bootGrace) but Render's 5s HTTP probe
      # is not. Any transient >5s stall there = ungraceful Render restart →
      # re-cold-start → re-armed storm (the bqb1 ~3-min health-timeout restart
      # loop). Deferring the warmer lets the first ticks clear the boot window
      # alone; the cache is still front-loaded, just ~2.5 min later. Set `0` to
      # restore the pre-fix fire-immediately behaviour; clamped to [0, 600000].
      - key: COLD_START_DAILY_PREFETCH_BOOT_DELAY_MS
        sync: false
      # TRA-1271 (parent TRA-1266 → TRA-1210) — turn ON the OBSERVE-ONLY CRYPTO
      # IGNITION SCANNER so the demo book accrues the forward sample that
      # confirms-or-kills the strict RVOL≥6 breakout edge. Same shape as the other
      # observe-only demo flags above (shadow selector / reversal shadow / journal):
      # until this is set, `isCryptoIgnitionEnabled()` is false, the hourly pass
      # returns before ANY 4H candle fetch (zero cost/IO), and
      # `/api/health/crypto-ignition` reports `enabled:false`. When set, each hour it
      # pulls CLOSED 4H bars for the TRA-1217 42-name universe, classifies the regime,
      # records would-be ignition fires + their forward TP/stop/timeout resolution
      # (net-R for maker vs taker) and the ★ would-a-limit-fill flag into
      # `/api/health/crypto-ignition` + a JSONL forward log under DATA_DIR.
      #
      # SAFETY — OBSERVE-ONLY, ZERO CAPITAL, NO ORDER/SIZING/ACCOUNT PATH anywhere
      # off this flag (it is a capture harness, not a trading path). Graduation to
      # live sizing is a separate board-visible decision (taker-cost CI must clear 0
      # first — currently straddles it, P≈0.81). Revert = clear this value. Accepts
      # the usual truthy spellings (1/true/yes/on).
      - key: ENABLE_CRYPTO_IGNITION_SCANNER
        value: "true"
      # TRA-1289 (parent TRA-1288 Option A → TRA-955/1242) — turn ON the
      # DEMO-ONLY, flag-gated forward-test fill path for the primary swing router
      # `sma200_pullback` so the demo paper book accrues signal-accuracy evidence
      # (TRA-955) and TRA-1242's leaf accrual (routine c60c98a2) can resume. bqb1
      # runs in DEMO mode, so this opens PAPER positions only.
      #
      # SAFETY — this is a ROUTER-LEVEL exemption, NOT a live-gate change. The
      # engine consults this flag ONLY on the `mode !== 'live'` branch; the live
      # path stays unconditionally blocked by the TRA-817 capital-gate manifest
      # (`isLiveEntryGatePassed`, which stays empty), so the flag is structurally
      # incapable of opening real capital. Fills are tagged `forwardTestOnly` so
      # accrual/promotion logic never read them as OOS keeper-gate evidence; live
      # promotion still requires clearing the OOS keeper gate (TRA-455/817).
      # Revert = clear this value. Accepts the usual truthy spellings.
      - key: ENABLE_SMA200_DEMO_FORWARD_TEST
        value: "true"
      # TRA-1300 (parent TRA-1290, board confirmation `38a50f39`) — arm the
      # OBSERVE-ONLY scale-out (take-profit) ladder overlay on the demo host so the
      # forward capture QuantTrader signs off can accrue. Trims an existing LONG
      # position on moves ABOVE the average entry (+25/35/45/60% ladder, +100% exit
      # remainder); the board REJECTED the add-down ladder (TRA-1291 NO-GO), so there
      # is NO averaging-down path. LOGS intended fee-aware trims into the durable
      # ledger backing GET /api/health/scaleout-ladder — it places NO order and
      # mutates NO book; the downside stays owned by the chandelier + give-back cap.
      # NOTE: blueprint sync ≠ autoDeploy on bqb1 (TRA-1289) — a redeploy (or the
      # DATA_DIR demo-flags.json override) is needed for this to take effect on the
      # running service. Accepts 1/true/yes/on.
      - key: ENABLE_SCALEOUT_LADDER
        value: "true"
      # TRA-1270 (parent TRA-1250) — ENABLE the board-approved exit-side
      # loss-control rules on bqb1: the ATR chandelier trailing stop + per-trade
      # profit-lock (Rules 1-2) AND the book-level daily give-back cap / hard
      # session stop (Rule 3, the board's headline "+$1,599 → +$483" fix). The
      # rules were approved via TRA-1249 (request_confirmation `d7175f7e`) and
      # QuantTrader signed off on threshold parity vs Appendix A (TRA-1307). The
      # replay against the board's own cached day floors it at +$950 (the +$959 =
      # 60%-retained give-back floor) and latches the entry halt — proof the guard
      # fires (TRA-1250 "demonstrably fires").
      #
      # SCOPE — this is a SERVICE-WIDE flag: it arms the give-back guard for BOTH
      # the demo paper book AND the live $550 Tradier book that bqb1 owns. The
      # book-halt blocks NEW opens for the session and the per-position trails
      # TIGHTEN-ONLY (never loosen; live stop-modify stays separately gated behind
      # LIVE_EQUITY_STOP_MODIFY_ENABLED). Existing resting broker legs are left in
      # place. Revert = clear this value (flip off) + redeploy.
      # NOTE: blueprint sync ≠ autoDeploy on bqb1 (TRA-1289) — a redeploy is
      # needed for this to take effect on the running service. Accepts 1/true/yes/on.
      - key: EXIT_RISK_RULES_ENABLED
        value: "1"
      # TRA-1294 (parent TRA-1290, board confirmation `73ef18b0`) — arm the
      # TAKE-PROFIT-EARLY auto-close (the PROFIT-side mirror of the give-back cap)
      # on the DEMO book. STANDALONE flag, deliberately NOT under
      # EXIT_RISK_RULES_ENABLED (above): TRA-1270 arms that master service-wide for
      # BOTH demo and the live book, but the board scoped take-profit-early to the
      # DEMO book only (interaction `73ef18b0`). The signal-engine attaches this
      # flag's 60%-capture fraction ONLY on the `mode === 'demo'` options exit
      # branch, so setting it here can NEVER touch the live options path regardless
      # of the master. On the demo book it banks a paper option once it captures
      # 60% of available profit (to the TP1 target) / max credit. Readout:
      # `GET /api/health/take-profit-early` (`enabled:true`). NOTE: blueprint sync ≠
      # autoDeploy on bqb1 (TRA-1289) — a redeploy is needed for this var to take
