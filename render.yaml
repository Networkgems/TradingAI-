# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint
#
# TRA-547 UPDATE (2026-06-03): a Render service IS now live and is the backend
# for the public GitHub Pages site — `https://tradingai-bqb1.onrender.com`
# (health verified `GET /api/health → {ok:true}`). The canonical public backend
# URL is recorded in `apps/desktop/src/server-url.ts` (`PROD_BACKEND_URL`) and
# the CI `VITE_SERVER_URL` secret. The `name:` below is now `tradingai-bqb1`
# to MATCH the live service (Render derives the hostname from the service
# name). The earlier name (`tradingai-server.onrender.com`) is dead (404); do
# not revert `name:` to it or a re-applied blueprint will provision a SECOND,
# empty service instead of updating the live one.
#
# ⚠️ Not multi-instance safe: never run two live instances against the same
# broker (Tradier) credentials.
#
# TRA-549 OWNERSHIP DECISION (CTO, 2026-06-03): THIS Render service
# (`tradingai-bqb1`) is the SINGLE owner of live (production) Tradier
# credentials — it is the only publicly-reachable backend (it serves the GitHub
# Pages site), whereas the self-hosted PM2 process on `PG-DEVOPS14`
# (`docs/runbook.md` §1) binds host-local with no reverse proxy and cannot be
# the public live-trading instance. The PM2 self-host is stood down to
# sandbox-only (`TRADIER_ENV=sandbox`, hard-pinned in `ecosystem.config.cjs`),
# so set `TRADIER_ENV=production` and the production `TRADIER_*` pair HERE (in
# the Render dashboard) — and NOWHERE else. Gate: this ownership must hold (or
# be explicitly re-decided, de-credentialing the loser first) before any change
# flips `LIVE_STRATEGY_PRESET` off `no_trade`. (TRA-609: that flip has now
# happened per board override — Render is the sole production live instance and
# the PM2 self-host is sandbox-only, so this ownership condition holds.)
#
# Historical (TRA-444, 2026-05-17): at that time no Render service was
# provisioned and production ran self-hosted under PM2. Superseded by the
# TRA-547 update above for the public-backend question.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: tradingai-bqb1
    runtime: node
    # TRA-1683 — `pro` (4 GB). THIS LINE IS LOAD-BEARING FOR THE WATCHDOG.
    #
    # It read `standard` (2 GB) until 2026-07-12 while the live service
    # `srv-d7mb7rr7uimc73ev0chg` had ALREADY been moved to `pro` in the Render
    # dashboard (TRA-1634). Nothing re-checked the constants derived from it, so
    # the event-loop watchdog kept its `rssMaxBytes` default of 1900 MB — sized
    # to trip ~100 MB BELOW a 2 GB cgroup — which on a 4 GB box is 47% of
    # capacity, i.e. INSIDE the normal RTH working set (2.0-2.2 GB). The guard
    # inverted: it stopped pre-empting the OOM and started executing a healthy
    # engine roughly every 7 minutes (38-40 self-restarts per RTH session).
    #
    # So: `plan` is not a billing detail. Three constants are derived from it,
    # and MOVING THE PLAN SILENTLY INVALIDATES ALL THREE:
    #   1. WATCHDOG_RSS_MAX_MB  — must sit ABOVE the RTH working set and BELOW
    #                             the cgroup kill line. Now 3400 (see below).
    #   2. NODE_OPTIONS --max-old-space-size — the V8 old-space cap.
    #   3. MALLOC_ARENA_MAX     — its rationale is quoted against the RSS budget.
    #
    # If you change this line, you MUST re-derive 1-3 in the same commit, and
    # `_default/tra1648_watchdog_ceiling_check.mjs` must still grade BRACKETED
    # (it reads the plan from the Render API and the EFFECTIVE ceiling from the
    # running process — never from this file, because this file was the lie).
    #
    # Do NOT revert to `standard`: the measured RTH peak is 2208 MB, which is
    # already ABOVE standard's entire 2048 MB cgroup — and that figure is a
    # LOWER BOUND, because the watchdog truncated every sample above 1900 MB.
    # That is why TRA-1635 (right-size pro -> standard) is a hard NO-GO.
    # `starter` (512 MB) would OOM on boot. CPU avg ~0.28 / peak ~0.96 of 1 vCPU.
    plan: pro
    # TRA-3719 (CTO, 2026-08-14) — this line read `pnpm run web:build` and was
    # WRONG. The live service has been building with `render-build` for months;
    # the blueprint was never updated. Corrected to match the money host, because
    # THE LIVE HOST IS THE FACT and re-pointing the dashboard at `web:build`
    # during go-live week would change what builds it. MEASURED, from the
    # "Running build command" banner Render itself prints at the top of every
    # build log — deploys 02:21Z / 05:12Z / 07:29Z on 2026-08-14 all print:
    #
    #     ==> Running build command 'pnpm install --frozen-lockfile && pnpm run render-build'...
    #
    # ⛔ DO NOT "correct" this back from the Render REST API. `GET /v1/services/
    # {id}` -> `serviceDetails.envSpecificDetails.buildCommand` is a THIRD,
    # PHANTOM string: `pnpm install --frozen-lockfile; pnpm run build`. It was
    # re-read 60s after the 07:29Z banner above and still disagreed, so it is not
    # a lag — that field simply does not report what Render executes. It is wrong
    # in three ways at once: wrong script, `;` instead of `&&` (so an install
    # failure would not stop the build), and `build` is
    # `pnpm --filter desktop tauri build` — a Tauri DESKTOP build that cannot
    # produce the `packages/server/dist/index.js` named by startCommand below.
    # The banner is the only reading of this field that has ever been true.
    buildCommand: pnpm install --frozen-lockfile && pnpm run render-build
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /api/health
    disk:
      name: tradingai-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      # TRA-404 — session-token max lifetime in hours. Leave unset for the
      # 24h default; `verifyToken` rejects any token older than this.
      - key: AUTH_TOKEN_TTL_HOURS
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      # TRA-1080 — pin the V8 old-space ceiling. Without this, V8 auto-sizes the
      # old-space heap, GC only gets aggressive very late, and the per-tick
      # growth during RTH drives back-to-back full GCs near the ceiling (the "GC
      # thrash" that starves the event loop and kills the HTTP listener).
      # Pinning makes the heap watchdog's `heap_size_limit` deterministic.
      # `--max-semi-space-size=64` enlarges the young generation so short-lived
      # per-tick allocations are collected by cheap scavenges instead of being
      # promoted into old space and amplifying the thrash.
      #
      # TRA-1683 — 1536 MB was ORIGINALLY derived from the (then-believed) 2 GB
      # `standard` box: "1536 heap + ~512 native = 2 GB". That premise is dead —
      # the box is `pro` (4 GB). The VALUE IS DELIBERATELY RETAINED ANYWAY, and
      # that is a decision, not neglect:
      #   - Measured RTH heap peaks at ~475 MB against this 1536 MB cap (~31%).
      #     There is no observed heap pressure, so there is nothing to fix.
      #   - RAISING it would be counter-productive: a bigger old space means GC
      #     runs later, which INCREASES RSS — and RSS is the binding constraint
      #     on this box (it is what the cgroup OOM-killer and the watchdog both
      #     watch). The cap currently helps bound the very metric under scrutiny.
      # Re-derive only with evidence of actual heap pressure (heap approaching
      # the cap), not merely because the box got bigger.
      - key: NODE_OPTIONS
        value: --max-old-space-size=1536 --max-semi-space-size=64
      # TRA-1463 — cap glibc malloc arenas to bound native RSS fragmentation.
      # ROOT-CAUSE of the residual ~85-min crash-restart cycle (the last gap the
      # TRA-1447 crypto-fanout hardening did not close): live watchdog telemetry
      # (57f99dd `externalMB`/`arrayBuffersMB`/`peakRssSinceBoot` on
      # /api/health/watchdog) proved the driver is an OFF-HEAP RSS ceiling, NOT a
      # JS heap leak and NOT event-loop starvation — across samples the V8 heap
      # sawtooths low under GC (~6%), event-loop lag stays <150 ms (well under the
      # 2 s watchdog threshold), and the *tracked* off-heap counters
      # (external + arrayBuffers ≈ 4-9 MB) are tiny, yet RSS is the binding
      # constraint (TRA-1683: the RSS budget quoted here — "1.53 GB steady vs the
      # 1.9 GB watchdog / 2 GB OOM" — was the STANDARD-plan budget and is now
      # stale; on `pro` the line is 3400 MB watchdog / 4 GB OOM against a 2.0-2.2 GB
      # RTH working set. The DIAGNOSIS is unaffected and the fix below is retained:
      # RSS-not-heap is still the binding constraint, so bounding native arena
      # fragmentation is if anything MORE relevant now, not less).
      # RSS retained far above the JS heap while `external` stays small is the
      # signature of glibc arena fragmentation: by default glibc opens up to
      # 8×nCPU arenas of up to 64 MB each, and the libuv threadpool + the crypto
      # daily-bars fan-out's concurrent `fetch` bursts each grab per-thread arenas
      # whose freed blocks are never returned to the OS. Under a burst those
      # transient arena spikes push the ~1.53 GB steady state past the 1.9 GB
      # watchdog / 2 GB OOM line ⇒ the ~85-min restart.
      #
      # Capping to 2 arenas is the standard, well-proven Node-on-glibc-container
      # fix (typically 20-40% RSS reduction) and directly buys the headroom to hold
      # a full ET RTH session (the TRA-1451 soak gate needs 7 h monotonic uptime).
      # It is NATIVE-ALLOCATOR ONLY — orthogonal to the V8 --max-old-space GC
      # tuning above (arenas are C malloc, not the GC heap) — and does NOT retune
      # the TRA-1447 crypto pacer (respects the TRA-1463 non-goal). CPU is idle
      # here (avg ~0.28 of 1 vCPU) so the slightly higher cross-thread malloc-lock
      # contention from fewer arenas is negligible. Behaviour/rate/capital-neutral.
      # Rollback = clear this value + redeploy. The 57f99dd watchdog breadcrumb is
      # retained, so if a trip still occurs `lastTrip` will still record whether
      # RSS is the driver (falsifiable). Ships via the git-push autoDeploy lever.
      - key: MALLOC_ARENA_MAX
        value: "2"
      # TRA-1565 — native-RSS relief for the residual TRA-1463 crash-loop. The
      # MALLOC_ARENA_MAX=2 cap above bounds the arena COUNT but not fragmentation
      # WITHIN the arenas, and did not hold the 2026-07-10 RTH soak (21 non-deploy
      # restarts on crypto.doTick). This flag arms two pure-code levers the
      # allocator tuning can't reach: (1) `refresh()` coalesces request-triggered
      # full-sweeps into a single debounced tick (removes the watchlist-edit / scan
      # amplifier of the concurrent-fetch arena churn), and (2) the daily-candle
      # fan-out batch narrows from 5→2 concurrent fetches (lowers the peak
      # simultaneous arena-grab footprint, so the RSS high-water mark settles
      # lower). Behaviour is identical except for refresh debounce + fetch pacing —
      # no pacer/rate/order/capital change. The CODE self-arms whenever `RENDER` is
      # set (dodging the TRA-1289/TRA-1481 blueprint env-sync gap), so this entry
      # is the explicit off-switch / rollback record: set to "0" + redeploy to
      # revert to the legacy fire-immediately + batch-5 behaviour.
      - key: CRYPTO_TICK_RSS_RELIEF
        value: "1"
      - key: DATA_DIR
        value: /data
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # TRA-2281 — `sync: false`, NOT a literal. This used to read
      # `value: noreply@tradingai.app`, which a blueprint sync would have written
      # straight over the live value (`TradingAI <networkgemstore@gmail.com>`,
      # provisioned for TRA-2253). A literal `value:` is authoritative on every
      # sync; `sync: false` means the dashboard owns the key.
      #
      # The revert would have been SILENT: Gmail does not reject a `From` it does
      # not own, it REWRITES it to the authenticated account. A probe sent as
      # `From: TradingAI <noreply@tradingai.app>` was delivered with
      # `From: TradingAI <networkgemstore@gmail.com>`. So post-revert, mail keeps
      # being delivered and `/api/health/alerting` still reads green — the only
      # symptom is that config says one address and recipients see another. There
      # is no failing state to trip on. Keep this key dashboard-owned.
      #
      # `ALERT_EMAIL` — the other key TRA-2281 opened against — needed NO change:
      # it is ALREADY declared `sync: false`, far below in the observability block
      # next to `ALERT_WEBHOOK_URL` (grep `- key: ALERT_EMAIL`; no line number here
      # on purpose — the last five citations in this repo all drifted). This
      # blueprint declares exactly ONE service, so that distant declaration is in
      # the SAME `envVars` list as this one and does apply to tradingai-bqb1.
      # The ticket's "undeclared" claim was simply wrong.
      - key: SMTP_FROM
        sync: false
      # Crypto quote fallback — when set, CoinMarketCap serves quotes whenever the
      # Yahoo Finance crypto path is rate-limited or returns no data.
      - key: CMC_API_KEY
        sync: false
      # Crypto quote fallback (TRA-833) — CoinGecko `/coins/markets`. Resolves from
      # the Render datacenter egress IP (both Coinbase hosts time out there), prices
      # the whole universe in one batched call, and keeps Current / P&L flowing for
      # open positions. Works keyless at the public rate tier; set a free Demo key
      # here to raise the per-minute limit. Optional.
      - key: COINGECKO_API_KEY
        sync: false
      # Stocks minute-bar fallback (TRA-154) — when set, Twelve Data serves
      # consolidated 1-minute candles whenever Tradier (primary) and Yahoo
      # both miss for an "active interest" symbol (open position or recent
      # signal). Free tier is 800 req/day, 8 req/min — gating + per-minute
      # caching keep us inside. Also used by `backtest-equity` for historical
      # data pulls.
      - key: TWELVE_DATA_API_KEY
        sync: false
      # AI Options Ideas — Anthropic (Claude) API key for the live
      # `GET /api/options/ideas` feed (TRA-604 wiring, TRA-600 C5 UI). When
      # UNSET (current state) the endpoint correctly degrades: HTTP 200 with
      # `source:"non_live"`, empty `ideas`, and a note instructing to set
      # ANTHROPIC_API_KEY — the panel falls back to a labelled preview and
      # disables paper entry. This is the documented expected-non-bug
      # degradation that passed QA in TRA-685; declaring the key here (dashboard
      # `sync:false`) makes the blueprint launch-ready without committing the
      # secret. Spend is pre-authorized at the $50/mo cap with the auto-degrade
      # tripwire enforced in code per TRA-658 / TRA-604 (CFO guardrail). Set the
      # value in the Render dashboard at the C6 live-launch (TRA-686) to flip the
      # feed to `source:"live"`; leaving it unset keeps the feature in safe
      # preview mode.
      - key: ANTHROPIC_API_KEY
        sync: false
      # ───────────────────────────────────────────────────────────────────────
      # TRA-1202 — Anthropic bill cap to the owner's ~$5/week budget.
      #
      # Live readout showed the spend is the TRADING-AGENTS ADVISORY layer (the
      # "Proposals" path: per-30s-tick analyst/trader/risk LLM calls when the
      # per-user Trading-Agents banner is ON), NOT the AI Options Ideas tab
      # (`/api/health/options-spend` = $0/mo). On 2026-06-30 user `admin` had
      # already hit the OLD $10/user/day advisory cap by mid-session — i.e. up to
      # ~$70/week — which matches the ~$20/week invoices. Neither tab places
      # orders; this is generation cost, not execution.
      #
      # Three levers, all enforced in code (agent-spend-store / options-spend-store /
      # anthropic-llm-client) and overridable here without a code change:
      #   1) Advisory per-user/day cap $10 → $0.50  (~$3.50/wk worst case).
      #   2) Advisory company/day ceiling $100 → $0.50 (single-user demo; matches #1).
      #   3) AI Options Ideas monthly cap $50 → $5   (~$1.15/wk; currently $0 spend).
      #   Worst-case sum ≈ $4.65/wk < the $5/wk target. When a cap is reached the
      #   feature degrades to the deterministic ZERO-cost path (advisory) or a
      #   labelled non-live feed (ideas) — no user-facing break, no capital impact.
      #
      # 4) Strong tier Sonnet-4.6 → Haiku-4.5 for the trader/risk synthesis steps:
      #   ~3x cheaper input AND output, so the SAME $0.50/day buys ~3x more
      #   LLM-authored proposals before the cap trips. Haiku 4.5 keeps structured
      #   outputs (JSON schema) and temperature; it has no adaptive thinking, which
      #   is OFF by default here anyway. Analysts already run on Haiku (`fast`).
      #   Revert any line below to restore the prior cost/quality point.
      - key: TRADING_AGENTS_DAILY_USER_USD_CAP
        value: "0.50"
      - key: TRADING_AGENTS_COMPANY_DAILY_USD_CAP
        value: "0.50"
      - key: OPTIONS_IDEAS_MONTHLY_USD_CAP
        value: "5"
      - key: LLM_MODEL_STRONG
        value: claude-haiku-4-5
      # ───────────────────────────────────────────────────────────────────────
      # Tradier API credentials (TRA-191) — required for the options-chain
      # relative-value scanner to fetch live chains. With these unset the
      # scanner reports `no_credentials` and the engine simply skips options
      # scanning (equity / share trading is unaffected). All values are set
      # in the Render dashboard; we never commit them to source.
      #
      # Production credentials. Used when TRADIER_ENV=production.
      - key: TRADIER_API_TOKEN
        sync: false
      - key: TRADIER_ACCOUNT_ID
        sync: false
      # Sandbox / paper-trading credentials. Used when TRADIER_ENV=sandbox
      # (the default). Falls back to the unprefixed pair above when these
      # are unset so legacy single-pair setups still work.
      - key: TRADIER_SANDBOX_API_TOKEN
        sync: false
      - key: TRADIER_SANDBOX_ACCOUNT_ID
        sync: false
      # `sandbox` (default) or `production`. Use `sandbox` for paper testing
      # and `production` only when the trading account is confirmed and you
      # actually want to route real orders.
      - key: TRADIER_ENV
        sync: false
      # TRA-928 / TRA-911 (TRA-908 Phase A) — turn the OPTIONS shadow selector ON.
      # Until this is set, `isOptionShadowEnabled()` is false, the per-tick option-
      # structure pass in `signal-engine.ts` (gated at L1780) never runs, and
      # `GET /api/health/option-shadow-signals` reports `flagEnabled:false, count:0`
      # — i.e. the agents that pick call/put spreads emit NOTHING and the
      # live-capital gate accrues zero evidence (sample_size:0). This is the lever
      # the board's "nothing firing on options" report traces to.
      #
      # SAFETY — Phase A is observe-only: the pass APPENDS well-formed shadow
      # signals to an append-only JSONL ledger and NEVER routes an order or commits
      # capital (`option-shadow-ledger.ts` L19-22). It is gated to market hours and
      # rides the RV scanner's warm chain cache (no extra Tradier budget). Turning
      # it off again is just clearing this value.
      #
      # NOTE — necessary but not alone sufficient for visible call/put ideas:
      #   • the RV scanner must exist (needs the TRADIER_* prod creds above), else
      #     the shadow pass early-returns (`signal-engine.ts` L2968);
      #   • the AI options-ideas feed stays in non-live preview until
      #     ANTHROPIC_API_KEY (above) is set in the dashboard.
      - key: ENABLE_OPTION_SHADOW_SELECTOR
        value: "true"
      # TRA-1632 (TRA-1623A, parent TRA-1630/TRA-1623) — arm the NEWS-CATALYST
      # SHADOW window on the demo desk. Same observe-only shadow class as
      # ENABLE_OPTION_SHADOW_SELECTOR (above) / ENABLE_REVERSAL_SHADOW (below):
      # NO live capital, NO board approval consumed. D1 (`news_catalyst` watchlist
      # source) only ADDS names to watch; D2 (the pre/post-market report lean) only
      # ANNOTATES the report body / ReviewBlock.leaders and appends a shadow lean
      # row — it routes NO order, sizes nothing, touches no exit. `isNewsCatalystEnabled()`
      # reads raw process.env, so the durable arm is the RENDER_RATIFIED_DEMO_DEFAULTS
      # self-heal (demo-flags.ts) which seeds this into the boot env on Render; this
      # render.yaml entry keeps render.yaml the source of truth. QuantTrader forward-
      # validates on TRA-1630 (D1 incremental expectancy + D2 lean-hit-rate) via
      # `GET /api/health/news-catalyst-signals` (`flagEnabled/chosenCount/leanCount`).
      # NOTE: blueprint sync != autoDeploy on bqb1 (TRA-1289) — the push to main
      # triggers the redeploy via autoDeploy; the self-heal delivers the value.
      # Revert = clear this value + remove the demo-defaults entry + redeploy.
      # Accepts 1/true/yes/on.
      - key: ENABLE_NEWS_CATALYST_WATCHLIST
        value: "1"
      # TRA-1602 (TRA-1600C, parent TRA-1599) — arm the per-candidate COST-AWARE
      # FIRE BAR on the demo options opens (RV / OTM / directional). Board-ratified:
      # request_confirmation `427b57ee` ACCEPTED, on top of QuantTrader's TRA-1603
      # sign-off of the modeled-gross-R construction. The gate rejects a candidate
      # whose modeled GROSS R can't clear its structure's cost-aware bar (commission
      # + maker-adjusted spread cross + safety margin ⇒ ~1.25R on options), which is
      # how we stop paying spread cross on the mass of ~0-edge scratch ideas that
      # took the live-gate cohort to −0.63R net.
      #
      # SAFETY — DEMO-ONLY, PURE RISK-REDUCING. `costAwareGateReject` (signal-engine)
      # early-returns on `mode !== 'demo'` BEFORE it reads this flag, so it cannot
      # alter a LIVE option open regardless of any service-wide env; live admission
      # stays gated on the separate dark flags (TRA-1490/1491 → TRA-1582/1588). It
      # only ever makes the demo book open LESS — it can never create or up-size an
      # open. QuantTrader forward-validates via `GET /api/health/cost-aware-gate`
      # (armed / bars / admitted / rejected / avg modeled gross R either side).
      # NOTE: blueprint sync != autoDeploy on bqb1 (TRA-1289) — the push to main
      # triggers the redeploy via autoDeploy; the RENDER_RATIFIED_DEMO_DEFAULTS
      # self-heal (demo-flags.ts) delivers the value. Daemon-free DISARM: write
      # `{"ENABLE_OPTION_COST_AWARE_GATE":"0"}` via `/api/admin/demo-flags` — the file
      # layers OVER env and wins. Accepts 1/true/yes/on.
      - key: ENABLE_OPTION_COST_AWARE_GATE
        value: "1"
      # TRA-1662 (TRA-1600 A2) — arm the observe-only MAKER-CHASE SHADOW measurement
      # on the demo option book: re-poll quotes for contracts the book ALREADY opened
      # and record what a maker chase would have recovered. This is the counterpart to
      # the cost-aware bar above — TRA-1647 showed both option sleeves are net-negative
      # at their MEASURED taker cross (TRA-1656), so maker-fill routing (TRA-1601) is
      # the only thing that can rescue them, and its "60-70% recovery" claim has never
      # been measured because the chase ladder and its telemetry both shipped OFF.
      #
      # SAFETY — OBSERVE-ONLY. It routes no order, sizes nothing, touches no exit, and
      # reaches no capital; it only reads quotes for already-open demo contracts. Same
      # board-independent shadow class as ENABLE_OPTION_SHADOW_SELECTOR /
      # ENABLE_REVERSAL_SHADOW / ENABLE_NEWS_CATALYST_WATCHLIST, each of which is
      # likewise declared here. Reads out on `GET /api/health/option-maker-recovery`.
      #
      # DECLARED RETROACTIVELY (TRA-2222): this arm shipped as a
      # RENDER_RATIFIED_DEMO_DEFAULTS self-heal entry with no blueprint record, which
      # the TRA-2209 env-drift check surfaced on its first real run as
      # `selfHealed[].declared:false`. Declaring it here is a no-op at runtime (the
      # seed already supplies "1" when env and demo-flags.json both lack it) and makes
      # the blueprint tell the truth about what the box runs. `demo-flags.test.ts`
      # now FAILS if any self-heal entry is missing from this file, so the gap cannot
      # silently reopen. NOTE: blueprint sync != autoDeploy on bqb1 (TRA-1289) — the
      # self-heal, not this line, is what delivers the value. Daemon-free DISARM:
      # write `{"ENABLE_OPTION_MAKER_SHADOW":"0"}` via `/api/admin/demo-flags` — the
      # file layers OVER env and wins. Accepts 1/true/yes/on.
      - key: ENABLE_OPTION_MAKER_SHADOW
        value: "1"
      # TRA-967 / TRA-953 (TRA-908 Phase B) — turn OPTIONS PHASE-B PAPER
      # EXECUTION ON. Board-approved (approval c10b717e-294f-4718-8a7c-11a2cd18875f,
      # parallel to the shadow-flag approval 8fb26954 in TRA-942). Until this is
      # set, `isOptionPhaseBEnabled()` is false and the shadow selector's
      # per-tick `decision:'signal'` structures are observed-only (appended to the
      # JSONL ledger) and never routed into the paper options book —
      # `GET /api/health/options-pipeline` reports `phaseBPaperExecutionEnabled:false`.
      #
      # SAFETY — PAPER-ONLY. This is strictly subordinate to
      # ENABLE_OPTION_SHADOW_SELECTOR (above): with the shadow flag off this does
      # nothing. When on, each selected defined-risk structure routes into
