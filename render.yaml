      # (validated soak: peakLag 246ms, held past the ceiling, RSS flat). 0/absent
      # = unlimited = pre-TRA-1463 behaviour exactly; [1,64] = FIFO cap. Armed =4
      # on the service via the Render API (redeploy-durable) and ALSO boot-seeded
      # in code (renderInfraDefaults, TRA-1515) so it self-heals a full env reset;
      # this blueprint entry is the source-of-truth record. Capital-incapable: it
      # only serialises observe-only tick sweeps. NOTE: blueprint sync ≠ autoDeploy
