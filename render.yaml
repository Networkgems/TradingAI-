      # TRA-1080 — event-loop/heap starvation watchdog. The watchdog itself is
      # ON by default in code (no env needed); these knobs are declared
      # `sync: false` so an operator can DISABLE or RETUNE it from the dashboard
      # during an incident without a redeploy. Leave unset for the safe defaults:
      #   WATCHDOG_ENABLED=true, WATCHDOG_RESTART_ENABLED=true,
      #   WATCHDOG_HEAP_PCT=0.92, WATCHDOG_LAG_MS=2000, WATCHDOG_BREACH_SAMPLES=10
      #   (10 consecutive 1s samples ⇒ a trip needs ~10s of SUSTAINED >2s lag or
      #   >92% heap, so a single GC pause / slow tick never restarts a healthy
      #   box). TRA-1082 — WATCHDOG_BLOCK_MS=4000 adds an ACUTE single-block trip:
      #   one 1s window whose MAX lag ≥4s self-restarts immediately (a stall that
      #   long has already blown Render's 5s health-check budget, so a clean exit
      #   beats the platform's hard restart). Set WATCHDOG_RESTART_ENABLED=false to observe-only (metrics on
      #   /api/health/watchdog, no exit), or WATCHDOG_ENABLED=false to fully
      #   disable. The self-restart converts the bqb1 502 hang into a ~30s blip.
      - key: WATCHDOG_ENABLED
        sync: false
      - key: WATCHDOG_RESTART_ENABLED
        sync: false
      - key: WATCHDOG_HEAP_PCT
        sync: false
      - key: WATCHDOG_LAG_MS
        sync: false
      - key: WATCHDOG_BREACH_SAMPLES
        sync: false
      - key: WATCHDOG_BLOCK_MS
        sync: false
      # TRA-713 — persistent live-equity boot-arm (board-ratified approval
      # 979c77c1). FIX for "prod equity Live reverts to demo on restart": the
      # original arm lived only in the running engine's in-memory `mode`, so every
      # redeploy rehydrated the on-disk `demo` and booted out of Live. This pin
      # names the ONE production user whose stocks engine should boot directly into
      # Live (mode=live) at startup — no manual re-arm — handled by
      # `shouldBootArmLiveEquity` in `createUserContext`.
      #
      # SAFETY — this is REAL-money and deliberately SINGLE-USER scoped. It must
      # NOT be applied fleet-wide: `liveEquityTradingEnabled` defaults TRUE and the
      # live-equity client falls back to the SHARED server-wide TRADIER_API_TOKEN /
      # TRADIER_ACCOUNT_ID for any production-env engine, so a fleet-wide arm would
      # trade the shared prod account for every such user. The gate also requires
      # TRADIER_ENV=production + resolvable production creds, so leaving this empty
      # (or naming a user without prod creds) arms nothing. Disarm = clear this
      # value (or set the user's mode back to demo via Settings).
      - key: LIVE_EQUITY_BOOT_USER
        value: "admin"
      # TRA-324 / TRA-325 / TRA-421 — process-wide forced strategy preset
      # override. When set, every CryptoSignalEngine instance pins to this
      # preset regardless of the user's saved `activeStrategyPreset` selection
      # in the Settings UI. This is the ops-level kill-switch that pinned the
      # $180 board test (board decision on TRA-305, target 2026-05-06) to
      # bb_fade-only on SOL+DOGE.
      #
      # TRA-421 — pinned to `tra405_validated`: the TRA-405 §8 out-of-sample
      # go/no-go (board-confirmed) found the macd_bollinger / bb_fade edge
      # survives costs only on BTC-USD and SOL-USD, and that momentum /
      # breakout_vol are OOS-negative on every symbol tested. The preset
      # enables bb_fade alone and gates it to {BTC-USD, SOL-USD}. The earlier
      # `bb_fade_sol_doge` pin traded DOGE-USD, which TRA-405 found
      # OOS-negative (−5.2%, profit factor 0.50).
      #
      # TRA-434 (HISTORICAL) — risk stand-down, pinned to `no_trade`.
      # QuantTrader's clean-cache OOS re-validation (TRA-432) superseded TRA-405:
      # with the data cache rebuilt clean, bb_fade FAILS the CTO-adopted
      # lower-CI-bound robustness gate on both live legs (DOGE-USD block-bootstrap
      # CI entirely below zero; SOL-USD OOS -2.75%, p5 -8.57%). That NO-GO pinned
      # the live engine to `no_trade` (zero enabled strategies, empty symbol
      # whitelist — NO new entries on any symbol; open positions still exit).
      #
      # TRA-609 — RESUME LIVE PILOT per board override. The board (TRA-577
      # interaction 944ad8cc, ACCEPTED by local-board) OVERRODE QuantTrader's
      # NO-GO and authorised resuming the live crypto pilot, acknowledging the
      # negative-edge downside. This UN-PINS the TRA-434 `no_trade` stand-down:
      # the value is now empty, which `CryptoSignalEngine.resolvePreset('live')`
      # treats as "no forced pin" and falls through to the user's saved
      # `activeStrategyPreset` (the same preset the TRA-532 promotion gate
      # validates). Releasing to the per-user preset — rather than re-pinning a
      # forced roster like `legacy_5` — is deliberate: the gate
      # (`evaluateLiveTransitionGate`) checks `activeStrategyPreset`, so pinning
      # a different forced roster here would let the engine trade strategies the
      # gate never validated. Empty keeps engine == gate, so the gate stays the
      # single authoritative control.
      #
      # SAFETY — un-pinning alone places NO live entries. Two gates remain intact
      # and are NOT weakened here:
      #   • TRA-532 promotion gate — `PUT /api/account/settings` refuses to turn
      #     ON live crypto auto-trading unless EVERY strategy in the active preset
      #     is fully promoted (backtest + paper + sign-off). No crypto strategy is
      #     currently promoted and bb_fade fails robustness (TRA-432 NO-GO), so
      #     live auto-trading cannot be enabled — the pilot is GATE-BLOCKED.
      #   • TRA-526 deterministic risk caps / global kill switch — unchanged.
      # The path to live crypto P&L is to promote a gate-PASSING crypto strategy
