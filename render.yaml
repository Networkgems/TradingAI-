services:
  - type: web
    name: tradingai-server
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm run web:build
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /api/health
    disk:
      name: tradingai-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      # TRA-404 — session-token max lifetime in hours. Leave unset for the
      # 24h default; `verifyToken` rejects any token older than this.
      - key: AUTH_TOKEN_TTL_HOURS
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATA_DIR
        value: /data
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@tradingai.app
      # Crypto quote fallback — when set, CoinMarketCap serves quotes whenever the
      # Yahoo Finance crypto path is rate-limited or returns no data.
      - key: CMC_API_KEY
        sync: false
      # Stocks minute-bar fallback (TRA-154) — when set, Twelve Data serves
      # consolidated 1-minute candles whenever Tradier (primary) and Yahoo
      # both miss for an "active interest" symbol (open position or recent
      # signal). Free tier is 800 req/day, 8 req/min — gating + per-minute
      # caching keep us inside. Also used by `backtest-equity` for historical
      # data pulls.
      - key: TWELVE_DATA_API_KEY
        sync: false
      # Tradier API credentials (TRA-191) — required for the options-chain
      # relative-value scanner to fetch live chains. With these unset the
      # scanner reports `no_credentials` and the engine simply skips options
      # scanning (equity / share trading is unaffected). All values are set
      # in the Render dashboard; we never commit them to source.
      #
      # Production credentials. Used when TRADIER_ENV=production.
      - key: TRADIER_API_TOKEN
        sync: false
      - key: TRADIER_ACCOUNT_ID
        sync: false
      # Sandbox / paper-trading credentials. Used when TRADIER_ENV=sandbox
      # (the default). Falls back to the unprefixed pair above when these
      # are unset so legacy single-pair setups still work.
      - key: TRADIER_SANDBOX_API_TOKEN
        sync: false
      - key: TRADIER_SANDBOX_ACCOUNT_ID
        sync: false
      # `sandbox` (default) or `production`. Use `sandbox` for paper testing
      # and `production` only when the trading account is confirmed and you
      # actually want to route real orders.
      - key: TRADIER_ENV
        sync: false
      # TRA-324 / TRA-325 / TRA-421 — process-wide forced strategy preset
      # override. When set, every CryptoSignalEngine instance pins to this
      # preset regardless of the user's saved `activeStrategyPreset` selection
      # in the Settings UI. This is the ops-level kill-switch that pinned the
      # $180 board test (board decision on TRA-305, target 2026-05-06) to
      # bb_fade-only on SOL+DOGE.
      #
      # TRA-421 — pinned to `tra405_validated`: the TRA-405 §8 out-of-sample
      # go/no-go (board-confirmed) found the macd_bollinger / bb_fade edge
      # survives costs only on BTC-USD and SOL-USD, and that momentum /
      # breakout_vol are OOS-negative on every symbol tested. The preset
      # enables bb_fade alone and gates it to {BTC-USD, SOL-USD}. The earlier
      # `bb_fade_sol_doge` pin traded DOGE-USD, which TRA-405 found
      # OOS-negative (−5.2%, profit factor 0.50).
      #
      # TRA-434 — risk stand-down, pinned to `no_trade`. QuantTrader's
      # clean-cache OOS re-validation (TRA-432) supersedes TRA-405: with the
      # data cache rebuilt clean, bb_fade FAILS the CTO-adopted lower-CI-bound
      # robustness gate on both live legs (DOGE-USD block-bootstrap CI entirely
      # below zero; SOL-USD OOS -2.75%, p5 -8.57%). TRA-405's "go" — including
      # the BTC-USD leg `tra405_validated` carried — used the dirty cache and
      # is no longer trusted, so bb_fade has no clean lower-CI-bound-gate pass
      # on ANY symbol. Per the CTO directive, Phase-2 live-capital trading
      # stays on hold company-wide until a strategy passes that gate, so the
      # live engine is pinned to `no_trade`: zero enabled strategies, empty
      # symbol whitelist — it opens NO new entries on any symbol. Open
      # positions still close on their existing exit logic (the preset gates
      # entries only, not exits). To re-authorise a pilot once a strategy
      # passes the CI gate, repoint this value to the approved preset id.
      #
      # Drop the env var to release control back to per-user settings (default
      # `legacy_5` = pre-324 5-strategy roster). The legacy value
      # `bb_fade_sol_doge_only` from TRA-324 is still accepted (mapped to
      # `bb_fade_sol_doge`) for revert safety.
      - key: LIVE_STRATEGY_PRESET
        value: no_trade
      # TRA-406 — observability. All optional; sane defaults apply when unset.
      #   LOG_LEVEL          debug|info|warn|error (default info)
      #   ERROR_WEBHOOK_URL  HTTPS endpoint captured errors are POSTed to
      #                      (Sentry/Datadog ingest proxy, Slack webhook, …)
      #   ALERT_EMAIL        comma-separated ops recipients for alert emails
      #   ALERT_WEBHOOK_URL  HTTPS endpoint operational alerts are POSTed to
      #   DISK_MIN_FREE_PCT  free-space % below which a disk alert fires (10)
      - key: LOG_LEVEL
        sync: false
      - key: ERROR_WEBHOOK_URL
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: DISK_MIN_FREE_PCT
        sync: false
      # TRA-341 — process-wide override for the §6 single-symbol short cap on
      # the live perp router (fraction of strategy equity, e.g. `0.5` ↔ 50%).
      # Per-user `liveSingleSymbolShortCap` (Settings → Live Trading Risk)
      # wins; this env value only fills in when the per-user knob is unset.
      # Engine clamps the final value to (0, 1] and falls back to the spec
      # default 0.15 for non-finite / ≤ 0 inputs, so a malformed value can't
      # disable the gate. The cross-strategy 20% and total-book 30% caps are
      # NOT overridable — they're whole-book risk ceilings, not per-strategy
      # budgets. Leave unset to inherit the spec default.
      - key: LIVE_SINGLE_SYMBOL_SHORT_CAP
        sync: false
