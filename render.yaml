services:
  - type: web
    name: tradingai-server
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm run web:build
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /api/health
    disk:
      name: tradingai-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATA_DIR
        value: /data
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@tradingai.app
      # Crypto quote fallback — when set, CoinMarketCap serves quotes whenever the
      # Yahoo Finance crypto path is rate-limited or returns no data.
      - key: CMC_API_KEY
        sync: false
      # Stocks quote fallback — when set, Finnhub serves equity quotes whenever the
      # Yahoo Finance crumb fetch hits 429s. Free tier (60 req/min) is sufficient.
      - key: FINNHUB_API_KEY
        sync: false
