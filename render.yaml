# ─────────────────────────────────────────────────────────────────────────────
# Render Blueprint
#
# TRA-547 UPDATE (2026-06-03): a Render service IS now live and is the backend
# for the public GitHub Pages site — `https://tradingai-bqb1.onrender.com`
# (health verified `GET /api/health → {ok:true}`). The canonical public backend
# URL is recorded in `apps/desktop/src/server-url.ts` (`PROD_BACKEND_URL`) and
# the CI `VITE_SERVER_URL` secret. The `name:` below is now `tradingai-bqb1`
# to MATCH the live service (Render derives the hostname from the service
# name). The earlier name (`tradingai-server.onrender.com`) is dead (404); do
# not revert `name:` to it or a re-applied blueprint will provision a SECOND,
# empty service instead of updating the live one.
#
# ⚠️ Not multi-instance safe: never run two live instances against the same
# broker (Tradier) credentials.
#
# TRA-549 OWNERSHIP DECISION (CTO, 2026-06-03): THIS Render service
# (`tradingai-bqb1`) is the SINGLE owner of live (production) Tradier
# credentials — it is the only publicly-reachable backend (it serves the GitHub
# Pages site), whereas the self-hosted PM2 process on `PG-DEVOPS14`
# (`docs/runbook.md` §1) binds host-local with no reverse proxy and cannot be
# the public live-trading instance. The PM2 self-host is stood down to
# sandbox-only (`TRADIER_ENV=sandbox`, hard-pinned in `ecosystem.config.cjs`),
# so set `TRADIER_ENV=production` and the production `TRADIER_*` pair HERE (in
# the Render dashboard) — and NOWHERE else. Gate: this ownership must hold (or
# be explicitly re-decided, de-credentialing the loser first) before any change
# flips `LIVE_STRATEGY_PRESET` off `no_trade`. (TRA-609: that flip has now
# happened per board override — Render is the sole production live instance and
# the PM2 self-host is sandbox-only, so this ownership condition holds.)
#
# Historical (TRA-444, 2026-05-17): at that time no Render service was
# provisioned and production ran self-hosted under PM2. Superseded by the
# TRA-547 update above for the public-backend question.
# ─────────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: tradingai-bqb1
    runtime: node
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm run web:build
    startCommand: node packages/server/dist/index.js
    healthCheckPath: /api/health
    disk:
      name: tradingai-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      # TRA-404 — session-token max lifetime in hours. Leave unset for the
      # 24h default; `verifyToken` rejects any token older than this.
      - key: AUTH_TOKEN_TTL_HOURS
        sync: false
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATA_DIR
        value: /data
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: noreply@tradingai.app
      # Crypto quote fallback — when set, CoinMarketCap serves quotes whenever the
      # Yahoo Finance crypto path is rate-limited or returns no data.
      - key: CMC_API_KEY
        sync: false
      # Stocks minute-bar fallback (TRA-154) — when set, Twelve Data serves
      # consolidated 1-minute candles whenever Tradier (primary) and Yahoo
      # both miss for an "active interest" symbol (open position or recent
      # signal). Free tier is 800 req/day, 8 req/min — gating + per-minute
      # caching keep us inside. Also used by `backtest-equity` for historical
      # data pulls.
      - key: TWELVE_DATA_API_KEY
        sync: false
      # AI Options Ideas — Anthropic (Claude) API key for the live
      # `GET /api/options/ideas` feed (TRA-604 wiring, TRA-600 C5 UI). When
      # UNSET (current state) the endpoint correctly degrades: HTTP 200 with
      # `source:"non_live"`, empty `ideas`, and a note instructing to set
      # ANTHROPIC_API_KEY — the panel falls back to a labelled preview and
      # disables paper entry. This is the documented expected-non-bug
      # degradation that passed QA in TRA-685; declaring the key here (dashboard
      # `sync:false`) makes the blueprint launch-ready without committing the
      # secret. Spend is pre-authorized at the $50/mo cap with the auto-degrade
      # tripwire enforced in code per TRA-658 / TRA-604 (CFO guardrail). Set the
      # value in the Render dashboard at the C6 live-launch (TRA-686) to flip the
      # feed to `source:"live"`; leaving it unset keeps the feature in safe
      # preview mode.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Tradier API credentials (TRA-191) — required for the options-chain
      # relative-value scanner to fetch live chains. With these unset the
      # scanner reports `no_credentials` and the engine simply skips options
      # scanning (equity / share trading is unaffected). All values are set
      # in the Render dashboard; we never commit them to source.
      #
      # Production credentials. Used when TRADIER_ENV=production.
      - key: TRADIER_API_TOKEN
        sync: false
      - key: TRADIER_ACCOUNT_ID
        sync: false
      # Sandbox / paper-trading credentials. Used when TRADIER_ENV=sandbox
      # (the default). Falls back to the unprefixed pair above when these
      # are unset so legacy single-pair setups still work.
      - key: TRADIER_SANDBOX_API_TOKEN
        sync: false
      - key: TRADIER_SANDBOX_ACCOUNT_ID
        sync: false
      # `sandbox` (default) or `production`. Use `sandbox` for paper testing
      # and `production` only when the trading account is confirmed and you
      # actually want to route real orders.
      - key: TRADIER_ENV
        sync: false
      # TRA-324 / TRA-325 / TRA-421 — process-wide forced strategy preset
      # override. When set, every CryptoSignalEngine instance pins to this
      # preset regardless of the user's saved `activeStrategyPreset` selection
      # in the Settings UI. This is the ops-level kill-switch that pinned the
      # $180 board test (board decision on TRA-305, target 2026-05-06) to
      # bb_fade-only on SOL+DOGE.
      #
      # TRA-421 — pinned to `tra405_validated`: the TRA-405 §8 out-of-sample
      # go/no-go (board-confirmed) found the macd_bollinger / bb_fade edge
      # survives costs only on BTC-USD and SOL-USD, and that momentum /
      # breakout_vol are OOS-negative on every symbol tested. The preset
      # enables bb_fade alone and gates it to {BTC-USD, SOL-USD}. The earlier
      # `bb_fade_sol_doge` pin traded DOGE-USD, which TRA-405 found
      # OOS-negative (−5.2%, profit factor 0.50).
      #
      # TRA-434 (HISTORICAL) — risk stand-down, pinned to `no_trade`.
      # QuantTrader's clean-cache OOS re-validation (TRA-432) superseded TRA-405:
      # with the data cache rebuilt clean, bb_fade FAILS the CTO-adopted
      # lower-CI-bound robustness gate on both live legs (DOGE-USD block-bootstrap
      # CI entirely below zero; SOL-USD OOS -2.75%, p5 -8.57%). That NO-GO pinned
      # the live engine to `no_trade` (zero enabled strategies, empty symbol
      # whitelist — NO new entries on any symbol; open positions still exit).
      #
      # TRA-609 — RESUME LIVE PILOT per board override. The board (TRA-577
      # interaction 944ad8cc, ACCEPTED by local-board) OVERRODE QuantTrader's
      # NO-GO and authorised resuming the live crypto pilot, acknowledging the
      # negative-edge downside. This UN-PINS the TRA-434 `no_trade` stand-down:
      # the value is now empty, which `CryptoSignalEngine.resolvePreset('live')`
      # treats as "no forced pin" and falls through to the user's saved
      # `activeStrategyPreset` (the same preset the TRA-532 promotion gate
      # validates). Releasing to the per-user preset — rather than re-pinning a
      # forced roster like `legacy_5` — is deliberate: the gate
      # (`evaluateLiveTransitionGate`) checks `activeStrategyPreset`, so pinning
      # a different forced roster here would let the engine trade strategies the
      # gate never validated. Empty keeps engine == gate, so the gate stays the
      # single authoritative control.
      #
      # SAFETY — un-pinning alone places NO live entries. Two gates remain intact
      # and are NOT weakened here:
      #   • TRA-532 promotion gate — `PUT /api/account/settings` refuses to turn
      #     ON live crypto auto-trading unless EVERY strategy in the active preset
      #     is fully promoted (backtest + paper + sign-off). No crypto strategy is
      #     currently promoted and bb_fade fails robustness (TRA-432 NO-GO), so
      #     live auto-trading cannot be enabled — the pilot is GATE-BLOCKED.
      #   • TRA-526 deterministic risk caps / global kill switch — unchanged.
      # The path to live crypto P&L is to promote a gate-PASSING crypto strategy
      # (coordinate TRA-340 / TRA-305 / TRA-593). Running bb_fade live DESPITE the
      # NO-GO would require an explicit board manual-promotion override — do NOT
      # silently bypass the gate; escalate to the board first.
      #
      # The legacy value `bb_fade_sol_doge_only` from TRA-324 is still accepted
      # (mapped to `bb_fade_sol_doge`) if a forced pin is ever reinstated.
      - key: LIVE_STRATEGY_PRESET
        value: ""
      # TRA-456 — DEMO engine strategy preset. The `LIVE_STRATEGY_PRESET`
      # stand-down above is scoped to the LIVE engine only: it is a
      # capital-allocation control, and the demo engine trades paper money
      # with zero real-capital exposure. Freezing demo bought no risk
      # reduction and only blanked the board's dashboard (0 signals / 0
      # positions). The demo engine therefore runs this preset instead,
      # deterministically — it does NOT fall through to per-user
      # `activeStrategyPreset`, so the board always watches one consistent
      # roster. TRA-521 — the board asked for an ACTIVE demo dashboard (live
      # stays paused; they evaluate demo P&L before funding live).
      #
      # TRA-696 / TRA-698 — the demo pin is now `crypto_core`, the post-TRA-432
      # rebuild roster. TRA-695 backtested DCA+swing and returned NO-GO on swing
      # (all 6 symbols) and beta-not-alpha on DCA, so on the TRA-693 gate (board
      # approval `cf17cc82`, 2026-06-07) the board adopted the recommended path:
      # run `crypto_core` as a DCA-ONLY forward paper leg on {BTC-USD, SOL-USD}
      # to accumulate genuine forward OOS evidence before any live capital. The
      # code default (`DEMO_PRESET_DEFAULT`) is already `crypto_core`; this key
      # makes the demo pin explicit and matches it so the deployed demo engine
      # actually runs the forward leg. It is paper money and reaches nothing live
      # without passing the TRA-532 promotion gate. LIVE stays un-pinned (gate-
      # blocked, no live entries) — only the board re-promotes under TRA-693.
      - key: DEMO_STRATEGY_PRESET
        value: crypto_core
      # TRA-406 — observability. All optional; sane defaults apply when unset.
      #   LOG_LEVEL          debug|info|warn|error (default info)
      #   ERROR_WEBHOOK_URL  HTTPS endpoint captured errors are POSTed to
      #                      (Sentry/Datadog ingest proxy, Slack webhook, …)
      #   ALERT_EMAIL        comma-separated ops recipients for alert emails
      #   ALERT_WEBHOOK_URL  HTTPS endpoint operational alerts are POSTed to
      #   DISK_MIN_FREE_PCT  free-space % below which a disk alert fires (10)
      - key: LOG_LEVEL
        sync: false
      - key: ERROR_WEBHOOK_URL
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      - key: DISK_MIN_FREE_PCT
        sync: false
      # TRA-341 — process-wide override for the §6 single-symbol short cap on
      # the live perp router (fraction of strategy equity, e.g. `0.5` ↔ 50%).
      # Per-user `liveSingleSymbolShortCap` (Settings → Live Trading Risk)
      # wins; this env value only fills in when the per-user knob is unset.
      # Engine clamps the final value to (0, 1] and falls back to the spec
      # default 0.15 for non-finite / ≤ 0 inputs, so a malformed value can't
      # disable the gate. The cross-strategy 20% and total-book 30% caps are
      # NOT overridable — they're whole-book risk ceilings, not per-strategy
      # budgets. Leave unset to inherit the spec default.
      - key: LIVE_SINGLE_SYMBOL_SHORT_CAP
        sync: false
