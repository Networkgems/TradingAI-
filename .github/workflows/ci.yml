name: CI

# TRA-4477 — lint, typecheck and test are INDEPENDENT jobs, not steps of one chain.
#
# The old shape was one `ts-checks` job with Test as the final step. TRA-4440
# measured what that costs: `main` red for 6.5 weeks (runs #1063–#1777) behind a
# fail-fast step 7, during which typecheck, lint and the whole 9,084-test suite
# NEVER EXECUTED ONCE — and the run conclusion is the only thing most readers look
# at. Now every axis runs and reports on every push; the first failure hides
# nothing behind it.
#
# `ci-verdict` is the single REQUIRED status (branch protection on `main` names
# it). It grades the run by its OWN /jobs step list — presence, conclusion and
# step durations of every expected job — never by the run conclusion, and its
# grading logic proves it can refuse via mutation controls on every fire
# (scripts/ci-verdict.mjs --selftest). Pages and release refuse to promote any
# SHA this verdict has not verified green (scripts/require-green-ci.mjs).

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# The verdict job grades this very run's /jobs list over the REST API. The repo's
# default workflow token is restricted (no `actions` scope): run #1797 had every
# job green and still went red because that read 403'd — the gate correctly graded
# it BLIND rather than passing on `needs` alone. This is the grant that read needs.
permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust-lint:
    name: Rust lint (cargo clippy)
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

  # The guard family stays grouped — these are cheap, ordered on purpose (stale-js
  # must precede anything that compiles), and none of them gates the suite: lint,
  # typecheck and test run in their own jobs regardless of what happens here.
  guards:
    name: Guards (stale-js / data-dir / cycles / deploy-build gate / prover)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          # TRA-2372 — full history, NOT the default shallow clone. The monotonicity prover
          # below is a differential against a PRE-R1 sha (`git show 88a072e:…`), which is
          # unreachable at fetch-depth 1; the prover fails closed, so a shallow clone would
          # make that step permanently BLIND rather than quietly wrong. Still: a step that
          # is always red gets ignored, which is the same end state as no step at all.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TRA-1660 — runs before build/test: stale in-place `tsc` output shadows the
      # TS sources and can make the suite pass against code we are not shipping.
      # A green run below is only meaningful if this step is green first.
      - name: Check for stale compiled output shadowing TS sources
        run: pnpm check:stale-js

      # TRA-2603 — beside check:stale-js, and before build/test. Ratchets the count of
      # unguarded `process.env.DATA_DIR ?? join(__dirname,'..','data')` copies against a
      # frozen, hand-edited baseline (38 today; the migration is TRA-2428). `??` does not
      # guard a present-but-BLANK env value — bqb1 has reached that state twice
      # (TRA-2193/TRA-2195) and it fails SILENTLY: every write succeeds and the data
      # evaporates on redeploy. The controls are `pnpm check:data-dir:controls`.
      - name: Check for unguarded DATA_DIR resolver copies
        run: pnpm check:data-dir

      # TRA-2603 — the guard's own both-direction controls: a real planted copy must FAIL,
      # a zeroed pattern must read BROKEN not CLEAN, `-a` must be provably load-bearing
      # against the NUL-byte file, and the baseline must not regenerate itself.
      - name: DATA_DIR guard controls (TRA-2603)
        run: pnpm check:data-dir:controls

      # TRA-1684 — also before build/test. A circular import only throws from SOME
      # entry points, so prod and the suite can enter the same graph through different
      # doors and only one of them crashes (TRA-1674). A green suite is not
      # evidence the import graph is sound; this step is.
      - name: Check for import cycles
        run: pnpm check:cycles

      # TRA-3695 — the DEPLOY'S OWN build command, named as such and run FIRST.
      #
      # `070a188a` reached origin/main with a hard TS error and eight commits landed on top
      # of it before a live deploy to the money host was the thing that noticed. The
      # typecheck job compiles the packages too, but it is `pnpm typecheck` and a package
      # glob — NOT the chain the Render dashboard executes, and the two are not the same
      # set (`render-build` hardcodes four packages, `web:build` globs five). This step
      # parses the deploy's own scripts and runs those segments verbatim, so a chain that
      # only the deploy runs cannot go ungraded here.
      #
      # `--worktree` is correct in CI and only in CI: actions/checkout gives a pristine tree
      # that IS the commit, so isolation would buy nothing. Locally the gate isolates,
      # because a developer's tree is not the commit.
      - name: Deploy build gate — the deploy's own build command (TRA-3695)
        run: pnpm check:deploy-build --worktree

      # TRA-3695 — the gate above is a DETECTOR (it runs after the push, like everything
      # else in this file). The BLOCKING copy is the `.githooks/pre-push` hook, and
      # `core.hooksPath` is local config that is not committed — so "installed" is the thing
      # that silently is not. This asserts the hook is tracked, wired to `prepare`, and that
      # `pnpm install` above actually armed it.
      - name: Pre-push build gate is installed (TRA-3695)
        run: pnpm check:deploy-build --verify-hook

      # TRA-3695 — the gate's own both-direction controls, run on LIVE HISTORY (needs the
      # fetch-depth: 0 above): `070a188a` must read BROKEN and reproduce the Render log's own
      # `(202,66) error TS18047`, and `1ff4fa7b` must read CLEAN. Without that second arm a
      # gate hardwired to refuse would pass every other control.
      - name: Deploy build gate controls (TRA-3695)
        run: pnpm check:deploy-build:controls

      - name: Build shared packages
        run: pnpm -r --filter './packages/**' build

      # TRA-2372 — controls for the TRA-2361 AC5 monotonicity prover. It runs the prover
      # TWICE and requires exit 0 both times, and requires the temp PRE-R1 gate copy the
      # prover checks out into `packages/server/src/` to be gone after a forced BLIND.
      # Both defects it guards against were invisible to a single green run: one made the
      # prover work exactly once, the other stranded a second copy of the capital gate in
      # `src/` on the BLIND path — where `pnpm check:stale-js` cannot see it, because that
      # guard looks for compiler OUTPUT and the strand is a `.ts`.
      - name: Monotonicity prover controls (TRA-2361 AC5)
        run: pnpm check:tra2361-prover

  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # eslint.config.mjs is not type-aware (tseslint `recommended`, no
      # projectService), so no package build is needed here.
      - name: Lint
        run: pnpm lint

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm typecheck` builds the @trading-app/* packages itself, then runs
      # `tsc --noEmit` across the workspace — self-provisioning by design.
      - name: Type check
        run: pnpm typecheck

  test:
    name: Test (vitest)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: `pretest` runs the TRA-4420 arg-guard suite, whose ARM 0
          # reconstitutes a187fc14's bytes via `git show` — unreachable at depth 1.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same provisioning the old single-job chain gave the suite: workspace deps
      # resolve to dist/, and `pretest` (which builds three of the packages) was
      # written for the local loop, not as the only provisioning.
      - name: Build shared packages
        run: pnpm -r --filter './packages/**' build

      - name: Test
        run: pnpm test

  # The single REQUIRED status. Grades this very run by its /jobs step list and
  # durations (TRA-4440's lesson: never the run conclusion), and proves on every
  # fire that its own grading logic can refuse (mutation selftests). A skipped or
  # dropped job reads BROKEN/BLIND here, never green.
  ci-verdict:
    name: CI verdict
    needs: [rust-lint, guards, lint, typecheck, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Verdict gate mutation controls (a gate nobody has seen refuse is not a gate)
        run: |
          node scripts/ci-verdict.mjs --selftest
          node scripts/require-green-ci.mjs --selftest

      - name: Grade this run by its jobs and steps, never the conclusion
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-verdict.mjs
