name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust-lint:
    name: Rust lint (cargo clippy)
    runs-on: ubuntu-22.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

  ts-checks:
    name: TypeScript (tsc + eslint + vitest)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
        with:
          # TRA-2372 — full history, NOT the default shallow clone. The monotonicity prover
          # below is a differential against a PRE-R1 sha (`git show 88a072e:…`), which is
          # unreachable at fetch-depth 1; the prover fails closed, so a shallow clone would
          # make that step permanently BLIND rather than quietly wrong. Still: a step that
          # is always red gets ignored, which is the same end state as no step at all.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TRA-1660 — runs before build/test: stale in-place `tsc` output shadows the
      # TS sources and can make the suite pass against code we are not shipping.
      # A green run below is only meaningful if this step is green first.
      - name: Check for stale compiled output shadowing TS sources
        run: pnpm check:stale-js

      # TRA-1684 — also before build/test. A circular import only throws from SOME
      # entry points, so prod and the suite can enter the same graph through different
      # doors and only one of them crashes (TRA-1674). A green suite below is not
      # evidence the import graph is sound; this step is.
      - name: Check for import cycles
        run: pnpm check:cycles

      - name: Build shared packages
        run: pnpm -r --filter './packages/**' build

      # TRA-2372 — controls for the TRA-2361 AC5 monotonicity prover. It runs the prover
      # TWICE and requires exit 0 both times, and requires the temp PRE-R1 gate copy the
      # prover checks out into `packages/server/src/` to be gone after a forced BLIND.
      # Both defects it guards against were invisible to a single green run: one made the
      # prover work exactly once, the other stranded a second copy of the capital gate in
      # `src/` on the BLIND path — where `pnpm check:stale-js` cannot see it, because that
      # guard looks for compiler OUTPUT and the strand is a `.ts`.
      - name: Monotonicity prover controls (TRA-2361 AC5)
        run: pnpm check:tra2361-prover

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
